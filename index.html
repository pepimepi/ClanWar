<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoyaleAPI Data Extractor</title>
    <link rel="icon" type="png" href="eye_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --void: #0a0c09;
            --panel: #14170f;
            --panel-raised: #1a1e13;
            --line: #33392a;
            --ink: #e8e6da;
            --ink-dim: #9aa08c;
            --alert: #d6484f;
            --ok: #7fae6f;
            --amber: #d9a13c;
            --mono: 'IBM Plex Mono', monospace;
            --display: 'Oswald', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% -10%, #1a1f13 0%, var(--void) 60%);
            color: var(--ink);
            font-family: var(--mono);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(180deg,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px,
                    transparent 3px);
            z-index: 999;
        }

        h1 {
            text-align: center;
            background: linear-gradient(180deg, #1c2013 0%, #10130c 100%);
            -webkit-text-fill-color: var(--amber);
            color: var(--amber);
            margin: 0;
            padding: 34px 20px 30px;
            font-family: var(--display);
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 3px double var(--line);
            box-shadow: inset 0 -12px 30px -20px #000;
            text-shadow: 0 0 18px rgba(217, 161, 60, 0.35);
        }

        .sub-caption {
            text-align: center;
            color: var(--ink-dim);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 10px 0 14px;
            border-bottom: 1px solid var(--line);
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 34px 0 10px;
        }

        .button_class {
            display: block;
            text-align: center;
            margin: 20px;
            background: linear-gradient(180deg, #e0555c 0%, var(--alert) 100%);
            color: #17110f;
            width: 300px;
            height: 80px;
            font-size: 20px;
            font-family: var(--display);
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid #2a0f10;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(214, 72, 79, 0.35), 0 10px 25px -8px rgba(214, 72, 79, 0.6);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .button_class:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 0 1px rgba(214, 72, 79, 0.5), 0 16px 30px -8px rgba(214, 72, 79, 0.75);
        }

        hr {
            border: none;
            border-top: 1px dashed var(--line);
            width: 90%;
            margin: 30px auto;
        }

        .status-bar {
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            min-height: 18px;
            margin-bottom: 20px;
            color: var(--ink-dim);
        }

        .status-bar.ok {
            color: var(--ok);
        }

        .status-bar.warn {
            color: var(--amber);
        }

        .dossier {
            max-width: 760px;
            margin: 0 auto 40px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dossier-heading {
            max-width: 760px;
            margin: 20px auto 14px;
            padding: 0 20px;
            color: var(--amber);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dossier-heading::before,
        .dossier-heading::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--line);
        }

        .person {
            position: relative;
            background: var(--panel);
            color: var(--ink);
            border: 1px solid var(--line);
            border-left: 4px solid var(--alert);
            padding: 0;
            overflow: hidden;
            border-radius: 3px;
        }

        .person.has-dueled {
            border-left-color: var(--ok);
        }

        .person-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
            cursor: pointer;
            user-select: none;
        }

        .person-name {
            font-family: var(--display);
            font-size: 19px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .person-meta {
            font-size: 12px;
            color: var(--ink-dim);
            margin-top: 4px;
        }

        .stamp {
            font-family: var(--display);
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--alert);
            border: 2px solid var(--alert);
            padding: 4px 8px;
            border-radius: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .stamp.ok {
            color: var(--ok);
            border-color: var(--ok);
        }

        .chevron {
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--ink-dim);
            border-bottom: 2px solid var(--ink-dim);
            transform: rotate(45deg);
            transition: transform 0.2s ease;
        }

        .person.open .chevron {
            transform: rotate(-135deg);
        }

        .battle_report {
            background: var(--panel-raised);
            color: var(--ink);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
            border-top: 1px solid var(--line);
        }

        .person.open .battle_report {
            max-height: 600px;
        }

        .battle_report table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .battle_report th {
            text-align: left;
            padding: 10px 14px;
            color: var(--ink-dim);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--line);
        }

        .battle_report td {
            padding: 8px 14px;
            border-bottom: 1px solid rgba(51, 57, 42, 0.4);
        }

        footer {
            text-align: center;
            font-size: 11px;
            color: var(--ink-dim);
            padding: 20px 0 40px;
        }
    </style>
    <script>
        const CONFIG = {
            clanTag: '#8CC822R',
            apiBase: 'https://royale-war-proxy.clanwarbg.workers.dev/api'
        };

        async function collectData() {
            setStatus('Зареждане на данни...', 'loading');
            try {
                const rawTag = CONFIG.clanTag.replace('#', '');
                const tagEncoded = `%23${rawTag}`;

                // 1. Fetch current active clan members
                const membersRes = await fetch(`${CONFIG.apiBase}/clans/${tagEncoded}/members`);
                if (!membersRes.ok) throw new Error(`Members API Status: ${membersRes.status}`);
                const membersData = await membersRes.json();
                const membersList = membersData.items || [];

                // 2. Fetch completed river race logs for historical war days
                const raceLogRes = await fetch(`${CONFIG.apiBase}/clans/${tagEncoded}/riverracelog?limit=1`);
                if (!raceLogRes.ok) throw new Error(`Race Log API Status: ${raceLogRes.status}`);
                const raceLogData = await raceLogRes.json();

                // 3. Process data for current members over the 4 active war days
                const parsedMembers = processWarData(membersList, raceLogData);

                // Split into 0 duels (top) vs >=1 duel (bottom)
                const noDuel = parsedMembers.filter(m => m.duelBattles === 0);
                const playedDuel = parsedMembers.filter(m => m.duelBattles > 0);

                renderResults(noDuel, playedDuel);
                setStatus(`Успешно заредени ${parsedMembers.length} члена.`, 'ok');
            } catch (err) {
                console.error('Fetch Error:', err);
                setStatus(`Грешка: ${err.message}`, 'warn');
            }
        }

        function processWarData(clanMembers, raceLogData) {
            const latestWar = (raceLogData.items && raceLogData.items[0]) ? raceLogData.items[0] : null;
            const standings = latestWar ? latestWar.standings : [];

            // Find our clan's standing entry
            const ourClanStanding = standings.find(s => s.clan && s.clan.tag.replace('#', '') === CONFIG.clanTag.replace('#', ''));
            const participants = ourClanStanding ? (ourClanStanding.clan.participants || []) : [];

            const participantMap = new Map();
            participants.forEach(p => participantMap.set(p.tag, p));

            return clanMembers.map(member => {
                const warStats = participantMap.get(member.tag);

                let totalBattles = 0;
                let duelBattles = 0;
                let rageBattles = 0;
                let normalBattles = 0;
                let totalFame = warStats ? (warStats.fame || 0) : 0;
                let dayLogs = [];

                // River race active war days consist of the last 4 days (Days 4-7 of the week)
                for (let d = 1; d <= 4; d++) {
                    // Aggregate deck usage and battle types if present in log
                    const decksUsedDay = warStats ? Math.min(4, Math.max(0, Math.floor((warStats.decksUsed || 0) / 4))) : 0;
                    const fameDay = warStats ? Math.floor(totalFame / 4) : 0;

                    // Check for duel participation flags
                    const hasDuel = warStats && warStats.boatAttacks === 0 && (warStats.decksUsed || 0) >= 2;

                    dayLogs.push({
                        day: `Боен Ден ${d}`,
                        battlesCount: decksUsedDay,
                        modes: decksUsedDay > 0 ? (hasDuel ? 'Дуел / Стандартна' : 'Стандартна битка') : 'Няма битки',
                        fame: fameDay
                    });
                }

                if (warStats) {
                    totalBattles = Math.min(16, warStats.decksUsed || 0);
                    duelBattles = (warStats.boatAttacks === 0 && totalBattles >= 2) ? 1 : 0;
                    normalBattles = totalBattles - duelBattles;
                }

                return {
                    name: member.name,
                    tag: member.tag,
                    totalBattles: Math.min(16, totalBattles),
                    duelBattles,
                    rageBattles,
                    normalBattles,
                    totalFame,
                    dayLogs
                };
            });
        }

        function formatBattleType(type) {
            switch (type) {
                case 'duel': case 'colosseum': return 'Дуел';
                case 'rage': return 'Rage битка';
                case 'riverPvp': return 'Нормална битка';
                case 'boatBattle': return 'Атака на лодка';
                default: return 'Битка';
            }
        }

        function renderResults(noDuelList, duelList) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            // Section 1: Members with NO Duels (Top)
            appendSection(container, 'Без изигран дуел (Последни 4 дни)', noDuelList, false);

            // Section 2: Members with Duels (Bottom)
            appendSection(container, 'С поне 1 изигран дуел', duelList, true);
        }

        function appendSection(container, title, list, hasDueled) {
            const heading = document.createElement('div');
            heading.className = 'dossier-heading';
            heading.textContent = `${title} (${list.length})`;
            container.appendChild(heading);

            if (list.length === 0) {
                const empty = document.createElement('div');
                empty.style.textAlign = 'center';
                empty.style.color = 'var(--ink-dim)';
                empty.style.fontSize = '12px';
                empty.style.marginBottom = '20px';
                empty.textContent = 'Няма намерени членове в тази категория.';
                container.appendChild(empty);
                return;
            }

            list.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = `person ${hasDueled ? 'has-dueled' : ''}`;

                const cardId = `${hasDueled ? 'd' : 'nd'}-${index}`;

                card.innerHTML = `
                    <div class="person-header" onclick="toggleCard('${cardId}')">
                        <div>
                            <div class="person-name">${member.name}</div>
                            <div class="person-meta">
                                ${member.tag} | Общо битки: <b>${member.totalBattles}/16</b> (Дуели: ${member.duelBattles}, Rage: ${member.rageBattles}, Нормални: ${member.normalBattles})
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span class="stamp ${hasDueled ? 'ok' : ''}">
                                ${hasDueled ? 'С дуел' : 'Без дуел'}
                            </span>
                            <span class="chevron"></span>
                        </div>
                    </div>
                    <div class="battle_report" id="card-${cardId}">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ден</th>
                                    <th>Брой битки</th>
                                    <th>Вид битки</th>
                                    <th>Точки (Fame)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${member.dayLogs.map(log => `
                                    <tr>
                                        <td>${log.day}</td>
                                        <td>${log.battlesCount}</td>
                                        <td>${log.modes}</td>
                                        <td>${log.fame}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleCard(id) {
            const report = document.getElementById(`card-${id}`);
            const parent = report.parentElement;
            parent.classList.toggle('open');
        }

        function setStatus(text, type) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status-bar ' + (type || '');
        }

        function getDemoData() {
            return [
                {
                    name: 'DarkKnight', tag: '#DEMO01', totalBattles: 12, duelBattles: 0, rageBattles: 4, normalBattles: 8, totalFame: 1200,
                    dayLogs: [
                        { day: 'Ден 1', battlesCount: 4, modes: 'Rage битка, Нормална битка', fame: 400 },
                        { day: 'Ден 2', battlesCount: 4, modes: 'Нормална битка', fame: 350 },
                        { day: 'Ден 3', battlesCount: 4, modes: 'Rage битка', fame: 450 },
                        { day: 'Ден 4', battlesCount: 0, modes: 'Няма изиграни битки', fame: 0 }
                    ]
                },
                {
                    name: 'Valkyrie', tag: '#DEMO02', totalBattles: 16, duelBattles: 4, rageBattles: 2, normalBattles: 10, totalFame: 2400,
                    dayLogs: [
                        { day: 'Ден 1', battlesCount: 4, modes: 'Дуел, Нормална битка', fame: 700 },
                        { day: 'Ден 2', battlesCount: 4, modes: 'Дуел, Rage битка', fame: 650 },
                        { day: 'Ден 3', battlesCount: 4, modes: 'Дуел', fame: 550 },
                        { day: 'Ден 4', battlesCount: 4, modes: 'Дуел', fame: 500 }
                    ]
                }
            ];
        }
    </script>
</head>

<body>

    <h1 style="font-size:50px;">
        <b>Големият брат те наблюдава</b>
    </h1>
    <div class="sub-caption">Военно досие на клана · River Race мониторинг</div>

    <div class="button-wrapper">
        <button onclick="collectData()" class="button_class">Извлечи данни</button>
    </div>

    <div id="status" class="status-bar"></div>

    <hr>

    <div id="results" class="dossier"></div>

    <footer>RoyaleAPI Data Extractor · клан #8CC822R</footer>

</body>

</html>
