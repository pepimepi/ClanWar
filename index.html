<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoyaleAPI Data Extractor</title>
    <link rel="icon" type="png" href="eye_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --void: #0a0c09;
            --panel: #14170f;
            --panel-raised: #1a1e13;
            --line: #33392a;
            --ink: #e8e6da;
            --ink-dim: #9aa08c;
            --alert: #d6484f;
            --alert-dim: #7a2a2e;
            --ok: #7fae6f;
            --amber: #d9a13c;
            --mono: 'IBM Plex Mono', monospace;
            --display: 'Oswald', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% -10%, #1a1f13 0%, var(--void) 60%);
            color: var(--ink);
            font-family: var(--mono);
            position: relative;
            overflow-x: hidden;
        }

        /* subtle CRT scanline atmosphere */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(180deg,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px,
                    transparent 3px);
            z-index: 999;
        }

        h1 {
            text-align: center;
            background: linear-gradient(180deg, #1c2013 0%, #10130c 100%);
            -webkit-text-fill-color: var(--amber);
            color: var(--amber);
            margin: 0;
            padding: 34px 20px 30px;
            font-family: var(--display);
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 3px double var(--line);
            box-shadow: inset 0 -12px 30px -20px #000;
            text-shadow: 0 0 18px rgba(217, 161, 60, 0.35);
        }

        h1 b {
            font-weight: 600;
        }

        .sub-caption {
            text-align: center;
            color: var(--ink-dim);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 10px 0 0;
            border-bottom: 1px solid var(--line);
            padding-bottom: 14px;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 34px 0 10px;
        }

        .button_class {
            display: block;
            text-align: center;
            margin: 20px;
            background: linear-gradient(180deg, #e0555c 0%, var(--alert) 100%);
            color: #17110f;
            width: 300px;
            height: 80px;
            font-size: 20px;
            font-family: var(--display);
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid #2a0f10;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(214, 72, 79, 0.35), 0 10px 25px -8px rgba(214, 72, 79, 0.6);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
        }

        .button_class:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 0 1px rgba(214, 72, 79, 0.5), 0 16px 30px -8px rgba(214, 72, 79, 0.75);
        }

        .button_class:active {
            transform: translateY(0);
        }

        hr {
            border: none;
            border-top: 1px dashed var(--line);
            width: 90%;
            margin: 30px auto;
        }

        .status-bar {
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            min-height: 18px;
            margin-bottom: 20px;
            color: var(--ink-dim);
        }

        .status-bar.ok {
            color: var(--ok);
        }

        .status-bar.warn {
            color: var(--amber);
        }

        .status-bar.loading {
            color: var(--ink-dim);
        }

        .status-bar.loading::after {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-left: 8px;
            border-radius: 50%;
            background: var(--ink-dim);
            animation: pulse 1s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        .dossier {
            max-width: 720px;
            margin: 0 auto 60px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dossier-empty {
            text-align: center;
            color: var(--ink-dim);
            font-size: 14px;
            padding: 30px 0;
            letter-spacing: 1px;
        }

        .dossier-heading {
            max-width: 720px;
            margin: 0 auto 18px;
            padding: 0 20px;
            color: var(--ink-dim);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dossier-heading::before,
        .dossier-heading::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--line);
        }

        /* --- person card / case file entry --- */
        .person {
            position: relative;
            background: var(--panel);
            color: var(--ink);
            border: 1px solid var(--line);
            border-left: 3px solid var(--alert);
            padding: 0;
            overflow: hidden;
            border-radius: 3px;
            box-shadow: 0 6px 18px -12px rgba(0, 0, 0, 0.7);
        }

        .person-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
            cursor: pointer;
            user-select: none;
        }

        .person-id {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .person-name {
            font-family: var(--display);
            font-size: 19px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink);
        }

        .person-meta {
            font-size: 11px;
            color: var(--ink-dim);
            letter-spacing: 1px;
        }

        .stamp {
            font-family: var(--display);
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--alert);
            border: 2px solid var(--alert);
            padding: 4px 10px;
            border-radius: 2px;
            transform: rotate(-6deg);
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0.9;
        }

        .chevron {
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--ink-dim);
            border-bottom: 2px solid var(--ink-dim);
            transform: rotate(45deg);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .person.open .chevron {
            transform: rotate(-135deg);
        }

        .battle_report {
            background: var(--panel-raised);
            color: var(--ink);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
            border-top: 1px solid var(--line);
        }

        .person.open .battle_report {
            max-height: 400px;
        }

        .battle_report table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }

        .battle_report th {
            text-align: left;
            padding: 10px 18px 6px;
            color: var(--ink-dim);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 10.5px;
            border-bottom: 1px solid var(--line);
        }

        .battle_report td {
            padding: 8px 18px;
            border-bottom: 1px solid rgba(51, 57, 42, 0.5);
        }

        .battle_report tr:last-child td {
            border-bottom: none;
        }

        .result-tag {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10.5px;
            letter-spacing: 0.5px;
        }

        .result-tag.win {
            background: rgba(127, 174, 111, 0.18);
            color: var(--ok);
        }

        .result-tag.loss {
            background: rgba(214, 72, 79, 0.18);
            color: var(--alert);
        }

        .result-tag.missed {
            background: rgba(154, 160, 140, 0.15);
            color: var(--ink-dim);
        }

        footer {
            text-align: center;
            font-size: 10.5px;
            color: var(--ink-dim);
            letter-spacing: 1px;
            padding: 20px 0 40px;
        }
    </style>
    <script>
        // ------------------------------------------------------------------
        // CONFIG
        // The official Clash Royale API (api.clashroyale.com) requires a
        // developer key bound to a fixed IP, and does not send CORS headers
        // for browser requests — so this page cannot call it directly.
        // apiBase points at the Cloudflare Worker proxy (see worker.js) that
        // holds the key and forwards /clans/... requests through RoyaleAPI's
        // static-IP relay. Replace the URL below with your deployed Worker's
        // address (looks like https://royale-war-proxy.YOUR-SUBDOMAIN.workers.dev).
        // Until it's set up, this page falls back to labeled demo data so the
        // layout can still be reviewed.
        // ------------------------------------------------------------------
        const CONFIG = {
            clanTag: '#8CC822R',
            apiBase: 'https://royale-war-proxy.clanwarbg.workers.dev/api',
            warDaysToCheck: 4
        };

        async function collectData() {
            setStatus('Свързване с бойния архив…', 'loading');
            renderMissing(null);

            let members;
            try {
                members = await fetchWarParticipation(CONFIG.clanTag, CONFIG.warDaysToCheck);
                setStatus(`Извлечени данни за клан ${CONFIG.clanTag} · последни ${CONFIG.warDaysToCheck} бойни дни.`, 'ok');
            } catch (err) {
                console.warn('Live fetch failed, showing demo dossier:', err);
                members = getDemoData();
                setStatus('Няма връзка с API — показва се демонстрационно досие.', 'warn');
            }

            const missing = members.filter(m => !hasParticipated(m, CONFIG.warDaysToCheck));
            renderMissing(missing);
        }

        function hasParticipated(member, days) {
            return member.log.slice(0, days).some(entry => entry.participated);
        }

        async function fetchWarParticipation(clanTag, days) {
            const tagEncoded = encodeURIComponent(clanTag);
            const res = await fetch(`${CONFIG.apiBase}/clans/${tagEncoded}/riverracelog?limit=${days}`);
            if (!res.ok) throw new Error(`API върна статус ${res.status}`);
            const raceLog = await res.json();
            return mapRiverRaceLogToMembers(raceLog, days);
        }

        function mapRiverRaceLogToMembers(raceLog, days) {
            const memberMap = new Map();
            const items = (raceLog.items || []).slice(0, days);

            items.forEach((warDay, dayIndex) => {
                const ourStanding = (warDay.standings || []).find(s => s.clan.tag === CONFIG.clanTag);
                if (!ourStanding) return;

                (ourStanding.clan.participants || []).forEach(p => {
                    if (!memberMap.has(p.tag)) {
                        memberMap.set(p.tag, { name: p.name, tag: p.tag, log: [] });
                    }
                    const decksToday = p.decksUsedToday ?? 0;
                    memberMap.get(p.tag).log.unshift({
                        day: `Ден ${days - dayIndex}`,
                        mode: 'Дуел',
                        participated: decksToday > 0,
                        result: decksToday > 0 ? 'Изигран' : 'Пропуснат',
                        fame: p.fame ?? 0
                    });
                });
            });

            return Array.from(memberMap.values());
        }

        function getDemoData() {
            return [
                {
                    name: 'ShadowBrew', tag: '#DEMO01', log: [
                        { day: 'Ден 4', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 3', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 2', mode: 'Лодка', participated: true, result: 'Загуба', fame: 180 },
                        { day: 'Ден 1', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 }
                    ]
                },
                {
                    name: 'NightHex', tag: '#DEMO02', log: [
                        { day: 'Ден 4', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 3', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 2', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 1', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 }
                    ]
                },
                {
                    name: 'Quietbolt', tag: '#DEMO03', log: [
                        { day: 'Ден 4', mode: 'Дуел', participated: true, result: 'Победа', fame: 210 },
                        { day: 'Ден 3', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 2', mode: 'Дуел', participated: false, result: 'Пропуснат', fame: 0 },
                        { day: 'Ден 1', mode: 'Лодка', participated: true, result: 'Победа', fame: 180 }
                    ]
                }
            ];
        }

        function setStatus(text, type) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status-bar ' + (type || '');
        }

        function renderMissing(missing) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (missing === null) return; // loading state, nothing to draw yet

            if (missing.length === 0) {
                container.innerHTML = '<div class="dossier-empty">Всички членове са участвали в поне един дуел през последните ' + CONFIG.warDaysToCheck + ' бойни дни.</div>';
                return;
            }

            missing.forEach((member, i) => {
                const card = document.createElement('div');
                card.className = 'person';

                const lastLog = member.log[0];
                card.innerHTML = `
                    <div class="person-header" onclick="toggleCard(${i})">
                        <div class="person-id">
                            <span class="person-name">${member.name}</span>
                            <span class="person-meta">${member.tag} · последно: ${lastLog ? lastLog.day : 'няма данни'}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:14px;">
                            <span class="stamp">Без участие</span>
                            <span class="chevron"></span>
                        </div>
                    </div>
                    <div class="battle_report">
                        <table>
                            <thead>
                                <tr><th>Ден</th><th>Режим</th><th>Резултат</th><th>Точки</th></tr>
                            </thead>
                            <tbody>
                                ${member.log.map(entry => `
                                    <tr>
                                        <td>${entry.day}</td>
                                        <td>${entry.mode}</td>
                                        <td><span class="result-tag ${resultClass(entry)}">${entry.result}</span></td>
                                        <td>${entry.fame}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function resultClass(entry) {
            if (!entry.participated) return 'missed';
            return entry.result === 'Победа' ? 'win' : 'loss';
        }

        function toggleCard(index) {
            const cards = document.querySelectorAll('.person');
            cards[index].classList.toggle('open');
        }
    </script>
</head>

<body>

    <h1 style="font-size:60px;">
        <b>Големият брат те наблюдава</b>
    </h1>
    <div class="sub-caption">Военно досие на клана · River Race мониторинг</div>

    <div class="button-wrapper">
        <button onclick="collectData()" class="button_class">Извлечи данни</button>
    </div>

    <div id="status" class="status-bar"></div>

    <hr>

    <div class="dossier-heading">Без участие в дуел · последни 4 бойни дни</div>
    <div id="results" class="dossier"></div>

    <footer>RoyaleAPI Data Extractor · клан #8CC822R</footer>

</body>

</html>
